
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>KanjiSensei</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<div class="container">


    <h1>🇯🇵 KanjiSensei</h1>


    <!-- =========================
         MAIN FLASHCARD
         ========================= -->

    <div id="card">


        <!-- LEFT SWIPE HINT -->

        <div class="swipeHint swipeHintLeft">

            <div class="swipeArrow">
                ←
            </div>

            <div class="swipeText">
                Swipe left
            </div>

            <div class="swipeAction">
                NEXT
            </div>

        </div>


        <!-- KANJI -->

        <div id="kanji">
            日
        </div>


        <!-- TAP HINT -->

        <div id="tapHint">
            👆 Tap to reveal
        </div>


        <!-- RIGHT SWIPE HINT -->

        <div class="swipeHint swipeHintRight">

            <div class="swipeArrow">
                →
            </div>

            <div class="swipeText">
                Swipe right
            </div>

            <div class="swipeAction">
                PREVIOUS
            </div>

        </div>


        <!-- DETAILS -->

        <div id="details">

            <div id="meaning"></div>

            <div id="onyomi"></div>

            <div id="kunyomi"></div>

            <div id="examples"></div>

        </div>


    </div>


    <!-- SWIPE EXPLANATION -->

    <div id="swipeExplanation">
        ↔ Swipe left or right to navigate
    </div>


    <!-- =========================
         CLOSE KANJI DETAIL
         ========================= -->

    <button
        id="kanjiDetailBack"
        style="display:none;"
    >
        ✕ Close
    </button>


    <!-- =========================
         NEXT BUTTON
         ========================= -->

    <button id="nextButton">
        Next Kanji
    </button>


    <!-- =========================
         SHOW ALL BUTTON
         ========================= -->

    <button id="showAllButton">
        Show All Kanji
    </button>


    <!-- =========================
         ALL KANJI VIEW
         ========================= -->

    <div
        id="allKanji"
        style="display:none;"
    >

        <button id="backButton">
            ← Back
        </button>


        <div id="kanjiGrid"></div>

    </div>


    <!-- =========================
         PROGRESS
         ========================= -->

    <div id="progress">
        1 / 100
    </div>


</div>


<!-- =========================
     JAVASCRIPT
     ========================= -->

<script src="kanji.js"></script>

<script src="app.js"></script>


</body>

</html>
