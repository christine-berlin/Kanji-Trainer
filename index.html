

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KanjiSensei</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>🇯🇵 KanjiSensei</h1>

    <div id="card">

        <div id="kanji">日</div>

        <div id="tapHint">👆 Tap to reveal details</div>

        <div id="swipeHint">

    <div class="swipeDirection swipeLeft">
        <span class="swipeArrow">←</span>
        <span>Swipe left</span>
        <strong>Previous</strong>
    </div>

    <div class="swipeDirection swipeRight">
        <span class="swipeArrow">→</span>
        <span>Swipe right</span>
        <strong>Next</strong>
    </div>

</div>
        
        <div id="details">

            <div id="meaning"></div>

            <div id="onyomi"></div>

            <div id="kunyomi"></div>

            <div id="examples"></div>

        </div>

    </div>

    <!-- Close button for the individual Kanji detail view -->
    <button id="kanjiDetailBack" style="display:none;">✕ Close</button>

    <!-- Main controls -->
    <div id="controls">

        <button id="showAllButton">
            ▦ Show All Kanji
        </button>

        <div id="progress">
            1 / 150
        </div>

        <button id="nextButton">
            Next Kanji →
        </button>

    </div>

    <!-- Show All Kanji view -->
    <div id="allKanji" style="display:none;">

        <button id="backButton">
            ← Back
        </button>

        <div id="kanjiGrid"></div>

    </div>

</div>

<script src="kanji.js"></script>
<script src="app.js"></script>

</body>
</html>
